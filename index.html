
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Bullying</title>
    <link rel="stylesheet" href="bully.css">
</head>

<body>

    <h1>STAND TOGETHER</h1>
    <p class="subtitle">Say NO! to bully, say YES! to buddy!</p>

    <!-- MAIN FLEXBOX CONTAINER -->

    <div class="container">

        <div class="poster">
            <img class="image" src="DT T2 Project.jpg">
        </div>

        <!-- LEFT BOX -->

        <div class="left-box">

            <h2>Types of Bullying</h2>

            <label>
                <input type="checkbox" name="bullying" value="Physical">
                Physical Bullying
            </label>

            <label>
                <input type="checkbox" name="bullying" value="Verbal">
                Verbal Bullying
            </label>

            <label>
                <input type="checkbox" name="bullying" value="Social">
                Social Bullying
            </label>

            <label>
                <input type="checkbox" name="bullying" value="Cyber">
                Cyberbullying
            </label>

            <label>
                <input type="checkbox" name="bullying" value="Other">
                Other
            </label>

        </div>

        <!-- RIGHT BOX -->

        <div class="right-box">

            <h2>Share Your Thoughts</h2>

            <form>

                <label for="name">Full Name</label>
                <input type="text" id="name" >

                <label for="email">Email Address</label>
                <input type="email" id="email">

                <label for="experience">Have you experienced or witnessed bullying?</label>
                <textarea id="experience" ></textarea>

                <label for="message">Your Message</label>
                <textarea id="message" ></textarea>

                <button type="submit">SUBMIT</button>

            </form>

        </div>

    </div>

        


</body>
</html>
